<style>
:root{
  --void:#07070F; --ink:#F2F1F6; --dim:#9A98B4; --faint:#5C5A78;
  --climate:#FF6B5A; --life:#C77DFF; --water:#4CC9F0; --soil:#FFC24B; --ozone:#4ADE9B;
  --accent:#FF6B5A;
  --display:"Instrument Serif",Georgia,serif;
  --sans:"Inter",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --spring:cubic-bezier(.22,1.2,.36,1); --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--void);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;

input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

#field{position:fixed;inset:0;z-index:0}
#aurora{position:fixed;inset:-25%;z-index:0;opacity:.44;filter:blur(72px);pointer-events:none;
  background:radial-gradient(38% 30% at 22% 26%,var(--accent),transparent 72%),
             radial-gradient(34% 26% at 78% 70%,#3B2D7A,transparent 72%),
             radial-gradient(30% 24% at 50% 94%,#0E3B57,transparent 72%);
  transition:background 1.1s var(--ease);animation:drift 28s var(--ease) infinite alternate;will-change:transform}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}
  50%{transform:translate3d(-3%,2%,0) scale(1.09)}100%{transform:translate3d(2%,-3%,0) scale(1.04)}}
#grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.04;mix-blend-mode:overlay;

#app{position:relative;z-index:2;height:100dvh;width:100%;max-width:520px;margin:0 auto;
  perspective:1400px;overflow:hidden}

  #app{max-width:420px;height:min(94dvh,900px);margin:3dvh auto;border-radius:42px;

.screen.out{animation:exit .32s var(--ease) both;pointer-events:none}

.d1{animation-delay:.05s}.d2{animation-delay:.11s}.d3{animation-delay:.17s}

.item{padding:16px 0;border-bottom:1px solid rgba(255,255,255,.07)}

.qtxt{font-size:15.5px;line-height:1.45;margin-bottom:12px}
.lik{display:flex;gap:7px}

textarea{width:100%;min-height:96px;border:1px solid rgba(255,255,255,.1);border-radius:16px;
  padding:14px;font-family:var(--sans);font-size:15.5px;color:var(--ink);
  background:rgba(255,255,255,.04);resize:none;outline:none}
textarea:focus{border-color:var(--accent)}
.chip{display:inline-block;padding:11px 15px;margin:0 7px 8px 0;border-radius:999px;font-size:14.5px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);
  transition:transform .2s var(--spring),opacity .25s}
.chip:active{transform:scale(.95)}
.chip[disabled]{opacity:.25}
.bub{max-width:84%;padding:13px 16px;border-radius:20px;margin-bottom:10px;font-size:15.5px;line-height:1.5;
  animation:pop .5s var(--spring) both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.bub.me{margin-left:auto;background:var(--ink);color:#0A0A14;border-bottom-right-radius:7px}
.bub.it{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-bottom-left-radius:7px}
.legend{display:flex;flex-wrap:wrap;gap:6px 13px;justify-content:center;flex:0 0 auto}
.legend span{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.legend i{width:6px;height:6px;border-radius:50%;display:block}
.cd{font-family:var(--mono);font-size:30px;font-weight:500;text-align:center;letter-spacing:.04em}
.bar{width:min(58vw,210px);height:3px;border-radius:999px;background:rgba(255,255,255,.14);
  margin:12px auto 0;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:var(--accent)}

#rail{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:22px;right:22px;display:none;gap:4px;z-index:6}
#rail.on{display:flex}
#rail i{flex:1;height:2px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden}
#rail i b{display:block;height:100%;width:0;background:var(--accent);transition:width .7s var(--spring)}
#rail i.done b{width:100%}#rail i.now b{width:100%;opacity:.4}
#save{position:fixed;left:12px;bottom:8px;z-index:90;font-family:var(--mono);font-size:8.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--faint);pointer-events:none;opacity:.6}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

    {key:"amb", name:"Just watch",      blurb:"Nothing to do for one minute. Only look.",                        accent:"--life"},
    {key:"base",name:"Just the numbers",blurb:"The same five limits, written out. Nothing to do but read.",      accent:"--dim"}
  ]
};
const QS=new URLSearchParams(location.search);
const WAVE=QS.get("w")==="2"?2:1, FAST=QS.get("fast")==="1";
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const APP=document.getElementById("app");
const tick=(ms=8)=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const setAccent=n=>document.documentElement.style.setProperty("--accent",cssv(n)||n);

/* ═══════════════════════════ content ═══════════════════════════ */
const B=[
 {key:"climate",name:"Climate",        col:"--climate",v:424,  lim:350, min:280,max:520,dp:0,unit:"ppm",
  ask:"How much CO₂ is in the air?",
  plain:"Carbon dioxide is the blanket around the planet. More of it, more heat stays in.",

 {key:"life",   name:"Living things",  col:"--life",   v:100,  lim:10,  min:0,  max:170,dp:0,unit:"per million",
  ask:"Out of every million species, how many are lost each year?",

 {id:"fly",  name:"Flying",             lo:"Monthly",        hi:"Never",
  e:{climate:-14,life:-2, water:-0.4,soil:-0.2,ozone:0}},
 {id:"buy",  name:"What you buy",       lo:"Always new",     hi:"Repair and reuse",
  e:{climate:-8, life:-7, water:-2.1,soil:-2.1,ozone:0}},
 {id:"land", name:"How land is farmed", lo:"More intensive", hi:"Restorative",
  e:{climate:-3, life:-48,water:-1.4,soil:-10.4,ozone:0}}
];
const ASKS=[
 {q:"Which of you is in the worst shape?",
  a:"Living things. My creatures are vanishing about <b>a hundred times faster</b> than they should. Climate gets the attention, but this is the limit you have pushed furthest.",f:"life"},
 {q:"Which one could recover fastest?",

 {t:"Your plate",q:"A city decides what to serve in its schools and hospitals for the next ten years.",
  o:[{l:"Meat at every meal, as now",e:{climate:14,life:11,water:1.6,soil:3.7,ozone:0}},
     {l:"Meat twice a week",         e:{climate:-12,life:-9,water:-1.3,soil:-3.1,ozone:0}},
     {l:"Mostly plants",             e:{climate:-26,life:-20,water:-2.9,soil:-6.8,ozone:0}}]},

 ["Five of the planet's limits, as they stand today.",

const press=(b,v)=>b.floor?b.lim/Math.max(v,1e-6):v/b.lim;
const state0=()=>Object.fromEntries(B.map(b=>[b.key,b.v]));
const overCount=s=>B.filter(b=>press(b,s[b.key])>1).length;

/* ═══════════════════════════ data layer ═══════════════════════════ */
function deviceId(){try{let d=localStorage.getItem("pp_device");
  if(!d){d="D"+Math.random().toString(36).slice(2,8).toUpperCase();localStorage.setItem("pp_device",d);}
  return d;}catch(e){return "D?";}}
function sessionSeq(){try{const n=(+localStorage.getItem("pp_seq")||0)+1;
  localStorage.setItem("pp_seq",String(n));return n;}catch(e){return 1;}}
function freshSession(){try{localStorage.removeItem("pp3_1");localStorage.removeItem("pp3_1_o");}catch(e){}
  const u=new URL(location.href);u.searchParams.delete("w");u.searchParams.delete("pid");
  u.searchParams.set("n",Date.now().toString(36));location.replace(u.toString());}
function jsonp(params){
  return new Promise((res,rej)=>{
    if(!CONFIG.endpoint) return rej(new Error("no endpoint"));
    const cb="cb"+Math.random().toString(36).slice(2,8);
    const t=setTimeout(()=>{cleanup();rej(new Error("timeout"))},9000);
    function cleanup(){clearTimeout(t);delete window[cb];if(sc.parentNode)sc.parentNode.removeChild(sc);}
    window[cb]=d=>{cleanup();res(d);};
    const sc=document.createElement("script");

const paintSave=t=>{const e=document.getElementById("save");if(e)e.textContent=t;};
const Store={

    if(this.d.events.length>400)this.d.events.shift(); this.save();},
  screen(id){this.d.cur=id;this.d.path.push({id,t:Date.now()-this.d.t0});this.save();},

  checkpoint(kind){

const PAR={x:0,y:0,tx:0,ty:0};
addEventListener("pointermove",e=>{PAR.tx=e.clientX/innerWidth-.5;PAR.ty=e.clientY/innerHeight-.5},{passive:true});
addEventListener("deviceorientation",e=>{if(e.gamma==null)return;
  PAR.tx=Math.max(-1,Math.min(1,e.gamma/42))*.9;PAR.ty=Math.max(-1,Math.min(1,((e.beta||45)-45)/42))*.7;},{passive:true});
(function ease(){requestAnimationFrame(ease);PAR.x+=(PAR.tx-PAR.x)*.055;PAR.y+=(PAR.ty-PAR.y)*.055;})();
(function(){
  const c=document.getElementById("field");if(!c||!c.getContext)return;
  const g=c.getContext("2d");let W=0,H=0,D=1,stars=[];
  function size(){D=Math.min(devicePixelRatio||1,2);
    W=c.width=Math.max(1,innerWidth*D);H=c.height=Math.max(1,innerHeight*D);
    c.style.width=innerWidth+"px";c.style.height=innerHeight+"px";
    stars=Array.from({length:Math.round(innerWidth*innerHeight/9500)},()=>({
      x:Math.random()*W,y:Math.random()*H,z:Math.random()*.8+.2,
      r:(Math.random()*1.1+.3)*D,t:Math.random()*6.283}));}
  size();addEventListener("resize",size);
  (function loop(t){requestAnimationFrame(loop);if(!W||!H)return;
    g.clearRect(0,0,W,H);g.fillStyle="#CFD2FF";
    for(const s of stars){g.globalAlpha=s.z*.6*(RM?1:(.55+.45*Math.sin(t/900+s.t)));
      g.beginPath();g.arc(s.x-PAR.x*44*D*s.z,s.y-PAR.y*44*D*s.z,s.r*s.z,0,6.283);g.fill();}
    g.globalAlpha=1;})(0);

/* ═══════════════════════════ the ring ═══════════════════════════ */
function Ring(host,opts){
  opts=opts||{};
  host.innerHTML="<canvas></canvas>";
  const c=host.firstChild; if(!c||!c.getContext) return {set(){},stop(){}};
  const g=c.getContext("2d"), TILT=.40, cols=B.map(b=>cssv(b.col));
  let W=0,H=0,D=1,CX=0,CY=0,S=0,raf=0,spin=0,dead=false,pulse=0;
  let cur=Object.assign({},opts.state||state0()), tgt=Object.assign({},cur);
  let ghost=opts.ghost?Object.assign({},opts.ghost):null, focus=opts.focus==null?-1:opts.focus;
  function size(){const r=host.getBoundingClientRect();
    if(r.width<2||r.height<2){W=H=0;return;}
    D=Math.min(devicePixelRatio||1,2);
    W=c.width=Math.round(r.width*D);H=c.height=Math.round(r.height*D);
    CX=W/2;CY=H*.52;S=Math.min(W,H)/2;}
  size(); requestAnimationFrame(size);
  const ro=("ResizeObserver" in window)?new ResizeObserver(size):null; if(ro)ro.observe(host);
  addEventListener("resize",size);
  const R=i=>S*(.345+i*.135), PX=()=>PAR.x*16*D, PY=()=>PAR.y*12*D;
  const pt=(r,a)=>[CX+r*Math.cos(a)+PX(),CY+r*Math.sin(a)*TILT+PY()];
  function stroke(r,from,to,near){let open=false;g.beginPath();
    for(let a=from;a<=to+1e-4;a+=.03){
      if((Math.sin(a)>0)!==near){open=false;continue;}
      const p=pt(r,a); if(!open){g.moveTo(p[0],p[1]);open=true;}else g.lineTo(p[0],p[1]);}
    g.stroke();}
  function orbits(near){
    for(let i=0;i<B.length;i++){
      const b=B[i],r=R(i),col=cols[i],dim=(focus>=0&&focus!==i);
      g.lineCap="round";
      g.globalAlpha=dim?.3:1;
      g.strokeStyle="rgba(255,255,255,.08)";g.lineWidth=D;stroke(r,0,6.2832,near);
      if(ghost){const pg=Math.min(press(b,ghost[b.key]),3.2)/3.2*6.2832;
        g.strokeStyle=col+"40";g.lineWidth=2.2*D;g.setLineDash([3*D,5*D]);
        stroke(r,-Math.PI/2,-Math.PI/2+pg,near);g.setLineDash([]);}
      const p=Math.min(press(b,cur[b.key]),3.2),sweep=p/3.2*6.2832;
      g.strokeStyle=col;g.lineWidth=((p>1?3.4:2.6)+(focus===i?pulse:0))*D;
      if(p>1){g.shadowColor=col;g.shadowBlur=13*D;}
      stroke(r,-Math.PI/2,-Math.PI/2+sweep,near);g.shadowBlur=0;
      const ha=-Math.PI/2+sweep;
      if((Math.sin(ha)>0)===near){const hp=pt(r,ha);
        g.fillStyle=col;g.shadowColor=col;g.shadowBlur=15*D;
        g.beginPath();g.arc(hp[0],hp[1],3.6*D,0,6.2832);g.fill();g.shadowBlur=0;}
      g.globalAlpha=1;
    }}
  function core(){
    const r=S*.235,cx=CX+PX(),cy=CY+PY();
    const rg=g.createRadialGradient(cx-r*.34,cy-r*.4,r*.06,cx,cy,r);
    rg.addColorStop(0,"#2C2B55");rg.addColorStop(.62,"#13122A");rg.addColorStop(1,"#07070F");
    g.fillStyle=rg;g.beginPath();g.arc(cx,cy,r,0,6.2832);g.fill();
    g.strokeStyle="rgba(255,255,255,.11)";g.lineWidth=D;g.stroke();
    g.textAlign="center";g.textBaseline="middle";g.fillStyle="#F2F1F6";
    g.font="400 "+Math.round(S*.2)+'px "Instrument Serif",Georgia,serif';
    g.fillText(String(overCount(cur)),cx,cy-S*.015);
    g.fillStyle="#9A98B4";g.font="500 "+Math.round(S*.05)+'px "JetBrains Mono",monospace';
    g.fillText("PAST THE LINE",cx,cy+S*.1);}
  (function frame(){
    if(dead)return; raf=requestAnimationFrame(frame);
    if(!W||!H){size();return;}
    for(const k in tgt) cur[k]+=(tgt[k]-cur[k])*.12;
    if(!RM){spin+=.0011;pulse=focus>=0?1.1+Math.sin(Date.now()/320)*.9:0;}
    g.clearRect(0,0,W,H);

      if(gh!==undefined)ghost=gh?Object.assign({},gh):null;

    stop(){dead=true;cancelAnimationFrame(raf);if(ro)ro.disconnect();}};
}

const C={};

/* 01 · guess first */

      const d=guess[b.key]-b.v, near=Math.abs(d)<(b.max-b.min)*.08;
      return '<div class="lever"><div class="lrow"><span class="lname">'+b.name+'</span>'+
        '<span class="lval">'+(near?"close":(d>0?"over by ":"under by ")+fmt(Math.abs(d),b.dp))+'</span></div>'+
        '<div class="poles"><span>you said '+fmt(guess[b.key],b.dp)+'</span>'+

/* 02 · move the levers */
C.dm=host=>new Promise(done=>{
  const start=state0(); const val={}; LEVERS.forEach(l=>val[l.id]=0);
  host.innerHTML=
    '<h3 style="margin-bottom:4px">Change how people live.</h3>'+
    '<p class="sm" style="margin-bottom:4px">Today is the middle. Push either way.</p>'+
    '<div class="stage s" id="stage"></div>'+legend()+
    '<div style="margin-top:10px">'+LEVERS.map(l=>
      '<div class="lever"><div class="lrow"><span class="lname">'+l.name+'</span>'+
      '<span class="lval mid" id="v_'+l.id+'">As things are</span></div>'+
      '<div class="lwrap"><input type="range" id="s_'+l.id+'" min="-100" max="100" value="0" style="--a:50%;--b:50%"></div>'+
      '<div class="poles"><span>← '+l.lo+'</span><b>today</b><span>'+l.hi+' →</span></div></div>').join("")+
    '</div>'+dock("That is my best");
  const r=Ring(host.querySelector("#stage"),{state:start,ghost:start});
  const t0=Date.now(); let moves=0;
  function recompute(){
    const n=Object.assign({},start);
    LEVERS.forEach(l=>{const f=val[l.id]/100;B.forEach(b=>{n[b.key]+=(l.e[b.key]||0)*f;});});
    B.forEach(b=>{if(n[b.key]<b.min)n[b.key]=b.min;if(n[b.key]>b.max)n[b.key]=b.max;});

});

/* 04 · decide and see */
C.dwc=host=>new Promise(done=>{
  let st=state0(); let i=0;
  function round(){
    if(i>=DECIDE.length){
      B.forEach(b=>Store.answer("dwc_end_"+b.key,+fmt(st[b.key],b.dp)));
      endOf({cond:"dwc",summary:"Three decisions, and the picture moved every time.",
        lines:["Every choice moved more than one limit. That is what makes this hard: there is no lever that touches only one thing.",

      '<div class="stage s" id="stage"></div>'+legend()+

        Store.answer("decision_"+(i+1),d.o[j].l,{index:j,ms:Date.now()-t0});
        const n=Object.assign({},st);
        B.forEach(b=>{n[b.key]=Math.max(b.min,Math.min(b.max,n[b.key]+(d.o[j].e[b.key]||0)));});

          '<div class="card rise" style="margin-top:14px" id="rip">'+

C.amb=host=>new Promise(async done=>{

  for(let i=0;i<3;i++){
    await new Promise(next=>{
      host.innerHTML=
        '<div class="spacer"></div>'+
        '<div class="stage" id="stage"></div>'+
        '<p class="rise" style="text-align:center;font-family:var(--display);font-size:21px;'+
        'max-width:24ch;margin:16px auto 0;line-height:1.3">'+esc(AMBIENT[i])+'</p>'+
        '<div class="spacer"></div>'+
        '<div class="cd" id="cd">0:'+String(phase).padStart(2,"0")+'</div>'+
        '<div class="bar"><b id="bar"></b></div>'+
        '<p class="eyebrow" style="text-align:center;margin-top:12px">Nothing to tap</p>';
      const r=Ring(host.querySelector("#stage"),{state:state0()});
      const t0=Date.now(); let hid=0;
      const vis=()=>{if(document.visibilityState==="hidden")hid++;};
      document.addEventListener("visibilitychange",vis);
      const iv=setInterval(()=>{
        const el=Math.min(phase,(Date.now()-t0)/1000);
        const bar=host.querySelector("#bar"),cd=host.querySelector("#cd");
        if(!bar){clearInterval(iv);return;}
        bar.style.width=(el/phase*100)+"%";
        const left=Math.ceil(phase-el);
        if(cd)cd.textContent="0:"+String(Math.max(0,left)).padStart(2,"0");
        if(el>=phase){clearInterval(iv);document.removeEventListener("visibilitychange",vis);
          Store.answer("amb_"+(i+1),"done",{hidden:hid}); next();}
      },200);
    });
  }
  await endOf({cond:"amb",summary:"That was the same picture, held still for a minute.",
    lines:["Nothing was asked of you. Whether that made it easier or harder to take in is exactly what this study is comparing."]});
  done();
});

    '<h2 class="rise d2" style="margin:10px 0 6px">Did you do or decide anything differently?</h2>'+
    '<p class="sm rise d3" style="margin-bottom:12px">An honest "no" is just as useful.</p>'+
    '<div class="rise d3" style="flex:1"><textarea id="ta" style="min-height:120px"></textarea></div>'+
    dock("Finish"));
  s.querySelector("#go").onclick=()=>{tick(14);
    Store.answer("intent",s.querySelector("#ta").value.trim());
    Store.d.complete=true;Store.save();Store.checkpoint("complete");w2done();};
}
function w2done(){
  setAccent("--ozone");
  const s=screen("w8",
    '<div class="spacer"></div>'+
    '<div class="stage rise d1" id="stage"></div>'+
    '<h2 class="rise d2" style="text-align:center;margin-top:16px">That is everything.</h2>'+
    '<p class="lead rise d3" style="text-align:center;margin-top:10px">Thank you. Your answers help work out '+
    'how this kind of information should reach people at all.</p>'+
    '<div class="spacer"></div>'+
    '<p class="eyebrow rise d4" id="ss" style="text-align:center">saving…</p>');
  ring(s,{state:state0()});
  Store.flush().then(()=>{const e=s.querySelector("#ss");
    if(e)e.textContent=Store.outbox.length?"finishing…":"all answers saved";});
}

/* ═══════════════════════════ boot ═══════════════════════════ */
(function boot(){
  if(QS.get("new")==="1"){try{localStorage.removeItem("pp3_1");localStorage.removeItem("pp3_1_o");}catch(e){}}
  const device={w:innerWidth,h:innerHeight,touch:("ontouchstart" in window)};
  const resumed=Store.init({
    pid:(WAVE===2?(QS.get("pid")||newPid()):newPid()),
    code:WORDS[Math.floor(Math.random()*WORDS.length)]+"·"+
         Math.random().toString(36).slice(2,6).toUpperCase(),
    t0:Date.now(), device, device_id:deviceId(), session_seq:sessionSeq(),
    prolific:QS.get("PROLIFIC_PID")||QS.get("prolific")||"",
    src:(QS.get("src")||QS.get("utm_source")||"direct").slice(0,40),
    ref:(document.referrer||"").slice(0,120)
  });
  Store.flush();
  if(WAVE===2) return w2();
  if(resumed&&Store.d.complete){
    const s=screen("d",'<div class="spacer"></div>'+
      '<h2 style="text-align:center">That session is finished.</h2>'+
      '<p class="lead" style="text-align:center;margin-top:10px">Code <b>'+esc(Store.d.code||"")+'</b>.</p>'+
      '<div class="spacer"></div>'+
      '<button class="btn" id="again">Start a new session</button>');
    s.querySelector("#again").onclick=()=>{tick(14);freshSession();};
    return;
  }
  if(resumed&&Store.d.order&&Store.d.answers.consent) return runCondition(Store.d.ci||0);
  consent();
})();
</script>
</body>
</html>
